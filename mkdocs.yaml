site_name: Home Compute Cluster Documentation

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - content.code.copy

plugins:
  - search
  - mermaid2

markdown_extensions:
  - attr_list
  - md_in_html

  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Motivation:
    - Why: motivation/01-motivation.md
    - Trade-offs: motivation/02-planning-tradeoffs-choices.md
    - Cost vs Value: motivation/03-cost-value-singapore.md
  - Architecture: system-architecture/home-cluster.md
  - CI/CD:
    - Pipeline Setup: CICD/cicd-pipeline-setup-guide.md
    - Off-the-shelf Software: CICD/cicd-offtheshelf-software.md
  - K3s: kubernetes-guides/k3s-kubernetes-guide.md
  - Containerization:
    - Dockerfile Guide: containerization/dockerfile-guide.md
    - Dev Container Setup: containerization/dynamic-dev-container-setup-guide.md
  - Lessons Learnt:
    - Overview: lessons/index.md
    - GitOps and ArgoCD: lessons/gitops-and-argocd.md
    - Secrets and Credentials: lessons/secrets-and-credentials.md
    - Networking and Remote Access: lessons/networking-and-remote-access.md
    - Storage and Backups: lessons/storage-and-backups.md
    - Control Plane and Nodes: lessons/control-plane-and-nodes.md
    - Debugging and Incidents: lessons/debugging-and-incident-response.md
    - Planning and Habits: lessons/planning-and-working-habits.md
  - Postmortems:
    - Overview: postmortems/index.md
    - 2026-09-02 deus lockup: postmortems/2026-09-02-deus-lockup.md
    - 2026-09-06 opus reset loop: postmortems/2026-09-06-opus-reset-loop.md
    - 2026-09-08 deus control-plane outage: postmortems/2026-09-08-deus-control-plane-outage.md
